<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ MeterNet | Command Center</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg: #0b1120; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #3b82f6; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --border: #334155; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); margin: 0; padding: 20px; height: 100vh; box-sizing: border-box; overflow: hidden; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .brand h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px; }
        .brand span { color: var(--accent); }
        .controls { display: flex; gap: 10px; }
        .btn { background: var(--card-bg); border: 1px solid var(--border); color: #e2e8f0; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn:hover { background: #334155; }
        .btn-danger { color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }
        .grid-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .card { background: var(--card-bg); padding: 15px 20px; border-radius: 8px; border: 1px solid var(--border); }
        .card h3 { margin: 0 0 5px 0; font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
        .card .value { font-size: 26px; font-weight: 800; color: #fff; }
        .dashboard-grid { display: grid; grid-template-columns: 7fr 3fr; gap: 20px; height: calc(100vh - 180px); }
        .panel { background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .panel-header { padding: 12px 15px; background: rgba(15, 23, 42, 0.6); border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .table-container { flex: 1; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #0f172a; padding: 12px 15px; font-size: 11px; color: var(--text-muted); text-transform: uppercase; position: sticky; top: 0; z-index: 10; }
        td { padding: 12px 15px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
        .mid { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #94a3b8; background: #0f172a; padding: 2px 6px; border-radius: 4px; }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .online { background: var(--success); box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        .offline { background: var(--text-muted); opacity: 0.5; }
        .console-box { background: #020617; font-family: 'JetBrains Mono', monospace; font-size: 11px; flex: 1; overflow-y: auto; padding: 12px; }
        .log-entry { padding: 4px 0; border-bottom: 1px solid #1e293b; display: flex; gap: 10px; }
        .log-time { color: #475569; min-width: 75px; }
        .log-INFO { color: var(--accent); }
        .log-WARNING { color: var(--warning); }
        .log-ERROR { color: var(--danger); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand"><h1><i class="fas fa-microchip"></i> MeterNet <span>Command Center</span></h1></div>
        <div class="controls">
            <button class="btn" onclick="adminAction('sync-github')"><i class="fab fa-github"></i> Update Scripts</button>
            
            <button class="btn" onclick="refreshData()"><i class="fas fa-sync-alt"></i> Sync Data</button>
            <button class="btn btn-danger" onclick="adminAction('clear-history')"><i class="fas fa-trash-alt"></i> Clear History</button>
            <button class="btn" onclick="logout()" style="background:var(--danger); border:none; color:white;"><i class="fas fa-power-off"></i> Logout</button>
        </div>
    </div>

    <div class="grid-cards">
        <div class="card"><h3>Active Nodes</h3><div class="value" id="val-nodes">0</div></div>
        <div class="card"><h3>Tasks Queued</h3><div class="value" id="val-queue" style="color:var(--warning)">0</div></div>
        <div class="card"><h3>LifeTime Success</h3><div class="value" id="val-success" style="color:var(--success)">0</div></div>
        <div class="card"><h3>Total Failures</h3><div class="value" id="val-failed" style="color:var(--danger)">0</div></div>
    </div>

    <div class="dashboard-grid">
        <div class="panel">
            <div class="panel-header"><span><i class="fas fa-network-wired"></i> Worker Network</span> <span id="last-update" style="color:var(--text-muted);font-size:10px;"></span></div>
            <div class="table-container">
                <table id="nodeTable">
                    <thead><tr><th>Status</th><th>Worker Profile</th><th>Machine Config</th><th>Performance</th><th>Reward Points</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header"><span><i class="fas fa-terminal"></i> Live Logs</span></div>
            <div class="console-box" id="logContainer"></div>
        </div>
    </div>

    <script>
        if (!document.cookie.includes('admin_access=true')) window.location.href = '/index.html';
        const socket = io({ query: { type: 'dashboard' } });

        socket.on('connect', () => appendLog({ time: new Date().toLocaleTimeString(), type: 'INFO', message: 'Connected to Stream.' }));
        socket.on('dashboard_update', updateDashboard);
        socket.on('new_log', appendLog);

        async function updateDashboard() {
            try {
                const res = await fetch('/api/dashboard-data');
                const data = await res.json();

                document.getElementById('val-nodes').innerText = data.onlineNodeCount;
                document.getElementById('val-queue').innerText = data.stats.queued;
                document.getElementById('val-success').innerText = data.stats.completed;
                document.getElementById('val-failed').innerText = data.stats.failed;
                document.getElementById('last-update').innerText = `Sync: ${new Date().toLocaleTimeString()}`;

                const tbody = document.querySelector('#nodeTable tbody');
                tbody.innerHTML = '';

                data.nodes.forEach(node => {
                    const isAlive = (new Date(node.lastActive) > new Date(Date.now() - 60000));
                    const isBusy = node.status === 'busy';
                    const isOnline = (node.status === 'online' || isBusy) && isAlive;
                    
                    const perf = node.performance || { success: 0, failed: 0 };
                    
                    let statusBadge = '';
                    if (!isOnline) {
                        statusBadge = '<span style="color:var(--text-muted); font-weight:700;">OFFLINE</span>';
                    } else if (isBusy) {
                        statusBadge = '<span style="color:var(--warning); font-weight:700;">BUSY ⚡</span>';
                    } else {
                        statusBadge = '<span style="color:var(--success); font-weight:700;">IDLE</span>';
                    }

                    const row = `
                        <tr style="${isOnline ? '' : 'opacity: 0.5;'}">
                            <td>
                                <span class="dot ${isOnline ? 'online' : 'offline'}" style="background: ${isBusy ? 'var(--warning)' : (isOnline ? 'var(--success)' : 'var(--text-muted)')}"></span>
                                ${statusBadge}
                            </td>
                            <td>
                                <div style="font-weight:700;">${node.name || 'Anonymous'}</div>
                                <div style="font-size:11px; color:var(--text-muted)">${node.designation || 'Worker'}</div>
                            </td>
                            <td>
                                <div class="mid">${node.machineId}</div><br>
                                <small style="color:var(--text-muted)">${node.ipAddress || 'Unknown IP'}</small>
                            </td>
                            <td>
                                <span style="color:var(--success); font-weight:bold;">${perf.success}</span> 
                                <span style="color:var(--text-muted); margin:0 4px;">/</span>
                                <span style="color:var(--danger); font-weight:bold;">${perf.failed}</span>
                            </td>
                            <td>
                                <div style="color:var(--accent); font-weight:800;">
                                    <i class="fas fa-gem" style="font-size:12px; margin-right:4px;"></i>${node.points || 0}
                                </div>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (e) { console.error("Data error", e); }
        }

        function appendLog(log) {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">${log.time}</span><span class="log-type log-${log.type}">${log.type}</span><span class="log-msg">${log.message}</span>`;
            container.insertBefore(entry, container.firstChild);
            if (container.children.length > 100) container.removeChild(container.lastChild);
        }

        async function adminAction(action) {
            if (!confirm("Are you sure?")) return;
            // এই ফাংশনটি /api/admin/sync-github কল করবে যখন action = 'sync-github' হবে
            await fetch(`/api/admin/${action}`, { method: 'POST' });
        }

        function logout() { document.cookie = "admin_access=; Max-Age=0; path=/;"; window.location.href = '/index.html'; }
        function refreshData() { updateDashboard(); appendLog({ time: new Date().toLocaleTimeString(), type: 'INFO', message: 'Manual Sync.' }); }
        
        updateDashboard();
    </script>
</body>
</html>
